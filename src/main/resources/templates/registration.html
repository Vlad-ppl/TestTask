<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .registration-container {
            background-color: #fff;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #333;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }

        input[type="submit"] {
            width: 100%;
            padding: 0.75rem;
            background-color: #007BFF;
            color: #fff;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: #0056b3;
        }

        .link {
            margin-top: 1rem;
            text-align: center;
        }

        .link a {
            color: #007BFF;
            text-decoration: none;
            font-weight: 500;
        }

        .link a:hover {
            text-decoration: underline;
        }

        .message {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.95rem;
        }

        .message p {
            color: red;
        }
    </style>
</head>
<body>

<div class="registration-container">
    <h2>Create Account</h2>

    <!-- Сообщение об ошибке -->
    <div class="message" th:if="${errorMessage}">
        <p th:text="${errorMessage}"></p>
    </div>

    <!-- Форма регистрации -->
    <form th:action="@{/registration}" method="post" th:object="${user}">
        <input type="text" th:field="*{name}" placeholder="Your Name" required />
        <input type="email" th:field="*{email}" placeholder="Your Email" required />
        <input type="password" th:field="*{password}" placeholder="Create Password" required />
        <input type="submit" value="Register" />
    </form>

    <div class="link">
        <p>Already have an account? <a th:href="@{/login}">Login here</a></p>
    </div>
</div>

</body>
</html>
