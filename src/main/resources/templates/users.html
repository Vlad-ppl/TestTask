<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Users</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        form {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            gap: 1rem;
        }

        input[type="text"], select {
            padding: 0.5rem;
            border-radius: 6px;
            border: 1px solid #ccc;
            width: 100%;
        }

        button {
            padding: 0.5rem 1rem;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 0.75rem 1rem;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #007BFF;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .action-btn {
            background: #ffc107;
            color: black;
            margin-right: 0.5rem;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
        }

        .back-button {
            margin-top: 1.5rem;
            display: inline-block;
            background-color: #007BFF;
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }

        .back-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>All Registered Users</h2>

    <!-- Форма поиска и фильтра -->
    <form th:action="@{/admin/users}" method="get">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="Search by name or email">
        <select name="role">
            <option value="">All Roles</option>
            <option value="USER" th:selected="${selectedRole == 'USER'}">USER</option>
            <option value="ADMIN" th:selected="${selectedRole == 'ADMIN'}">ADMIN</option>
        </select>
        <button type="submit">Search</button>
    </form>

    <!-- Таблица -->
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.name}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.userRole}"></td>
            <td>
                <a th:href="@{'/admin/users/edit/' + ${user.id}}" class="action-btn">Edit</a>
                <a th:href="@{'/admin/users/delete/' + ${user.id}}" class="delete-btn"
                   onclick="return confirm('Are you sure you want to delete this user?');">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a href="/" class="back-button">← Back to Profile</a>
</div>

</body>
</html>
