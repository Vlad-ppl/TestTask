<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Items List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            margin: auto;
            background-color: white;
            padding: 2rem;
            margin-top: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 2rem;
        }

        table, th, td {
            border: 1px solid #ddd;
        }

        th, td {
            padding: 1rem;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        .back-button {
            display: inline-block;
            padding: 0.5rem 1rem;
            background-color: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .back-button:hover {
            background-color: #0056b3;
        }

        .total {
            font-weight: bold;
            font-size: 1.2rem;
            text-align: right;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Available Items</h1>

    <table>
        <thead>
        <tr>
            <th>Name</th>
            <th>Price</th>
            <th>Add to Order</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td th:text="${item.itemName}"></td>
            <td th:text="${item.price}"></td>
            <td>
                <form method="post" th:action="@{/orders/add-item}">
                    <input type="hidden" name="itemId" th:value="${item.id}" />
                    <button type="submit">Add to Order</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="total">
        Total: <span th:text="${total} != null ? total : 0">0</span> ₴
    </div>

    <a href="/profile" class="back-button">Back to Profile</a>
    <br><br>
    <a href="/orders/my" class="back-button" style="background-color: #28a745;">My Orders</a>
</div>
</body>
</html>
