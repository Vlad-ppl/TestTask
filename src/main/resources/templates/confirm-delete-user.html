<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirm Delete</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8d7da;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .confirm-container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            width: 400px;
            text-align: center;
        }

        h2 {
            color: #dc3545;
            margin-bottom: 1rem;
        }

        p {
            margin-bottom: 2rem;
        }

        .btn {
            padding: 0.7rem 1.2rem;
            margin: 0.5rem;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-cancel {
            background-color: #6c757d;
            color: white;
        }

        .btn-cancel:hover {
            background-color: #5a6268;
        }

        .btn-delete {
            background-color: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

<div class="confirm-container">
    <h2>Confirm Deletion</h2>
    <p>Are you sure you want to delete user "<span th:text="${user.email}"></span>"?</p>

    <form th:action="@{'/admin/users/delete/' + ${user.id}}" method="post" style="display:inline;">
        <button type="submit" class="btn btn-delete">Yes, Delete</button>
    </form>

    <a th:href="@{/admin/users}" class="btn btn-cancel">Cancel</a>
</div>

</body>
</html>
